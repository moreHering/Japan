name: Deploy to GitHub Pages

on:
  push:
    # Das Repository hatte beim Anlegen noch keinen main-Branch. Damit der erste
    # Deploy auch vom Entwicklungsbranch aus läuft, ist dieser mit aufgeführt.
    # Sobald main existiert, kann die zweite Zeile entfernt werden.
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deploy gleichzeitig; laufende Deploys nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Das Tor. Ohne einen grünen Wächter wird nicht gebaut und nicht veröffentlicht.
  #
  # Was er prüft, steht in `wache.yml`: die Ortsdaten auf Plausibilität, die Typen,
  # 189 vitest-Prüfungen, den Build und die zehn Browsersuiten mit zusammen über 320
  # Prüfungen. Das kostet einige Minuten vor jedem Deploy. Der Preis ist bewusst:
  # Eine kaputte Karte oder ein Ort mit falscher Koordinate soll nicht live gehen.
  #
  # Die Kehrseite, damit sie nicht überrascht: Ein Fehlschlag blockiert dann auch
  # eine harmlose Textänderung. Wer in so einem Fall wirklich veröffentlichen muss,
  # startet `deploy.yml` über `workflow_dispatch` von einem Stand, der grün war —
  # nicht indem er dieses `needs` entfernt.
  wache:
    uses: ./.github/workflows/wache.yml

  build:
    needs: wache
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Zugangsdaten prüfen
        env:
          SB_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SB_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # Ohne diese beiden baut die Seite durch, kann aber nicht abgleichen.
          # Das soll sichtbar sein, nicht erst am stillen Hinweis in der App
          # auffallen. Ausgegeben wird nur die Länge, nicht der Wert.
          if [ -n "$SB_URL" ] && [ -n "$SB_KEY" ]; then
            echo "Supabase: URL (${#SB_URL} Zeichen) und Schlüssel (${#SB_KEY} Zeichen) vorhanden."
          else
            echo "::warning::PUBLIC_SUPABASE_URL oder PUBLIC_SUPABASE_ANON_KEY fehlt — die Seite wird ohne Geräte-Abgleich gebaut und arbeitet nur mit dem lokalen Speicher."
          fi

      - name: Astro-Seite bauen und hochladen
        uses: withastro/action@v6
        with:
          node-version: 22
        env:
          # Astro nimmt PUBLIC_*-Variablen zur Build-Zeit in das Bundle auf.
          # Der publishable Key ist dafür gedacht, öffentlich zu sein; die
          # Absicherung leistet Row Level Security in der Datenbank.
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          # Vorsorglich: Solange der Node-Cache trifft, läuft gar kein Install.
          # Sobald sich die Lockfile ändert, zöge Playwright aus den
          # devDependencies einen Chromium nach — rund 150 MB, die dieser Lauf
          # nie anfasst. Die Browsertests laufen im Wächter-Job davor und beim
          # Entwickeln — in **diesem** Job wird kein Browser gebraucht, deshalb
          # bleibt die Zeile richtig. (Sie stand hier einmal mit der Begründung
          # „Die Browsertests laufen beim Entwickeln, nicht hier", und das traf zu,
          # solange überhaupt nichts geprüft wurde.)
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
