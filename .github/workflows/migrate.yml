name: Datenbank migrieren

# Spielt die Migrationen aus supabase/migrations/ gegen das Supabase-Projekt ein.
#
# Warum über die CI und nicht aus der Entwicklungsumgebung: Die erreicht die
# Datenbank auf keinem Weg. Gemessen, nicht vermutet:
#
#   supabase.co / supabase.com   CONNECT tunnel failed, 403 am Proxy
#   db.<ref>.supabase.co         löst überhaupt nicht mehr auf
#   Pooler :5432 und :6543       keine Antwort (nur :443 ist offen)
#   IPv6                         keine globale Adresse vorhanden
#
# GitHub-Runner haben freies Netz. Deshalb läuft es hier.
#
# ## Was gebraucht wird — eines von beidem
#
# **`SUPABASE_DB_PASSWORD`** — nur das Datenbankpasswort. Alles andere sucht
# der Workflow selbst: Er probiert die Pooler der bekannten Regionen durch, bis
# das Projekt antwortet. Eine falsche Region meldet sofort "Tenant or user not
# found", das kostet kaum Zeit. Die gefundene Region meldet der Lauf, damit sie
# sich als Variable SUPABASE_REGION festschreiben lässt.
#
# **`SUPABASE_DB_URL`** — der vollständige Connection String, falls er zur Hand
# ist. Dann entfällt die Suche. Wo er im Dashboard steht, hängt von dessen
# Fassung ab; gesucht ist die Form
#   postgresql://postgres.<ref>:<passwort>@…pooler.supabase.com:5432/postgres
# also der **Session-Pooler**, nicht die direkte Verbindung: Letztere gibt es
# nur über IPv6, und das haben GitHub-Runner nicht.

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:
    inputs:
      loeschen_pruefen:
        description: 'Zusätzlich prüfen, ob das Löschen eines Freundebuch-Beitrags durchläuft (ändert nichts — die Probe wird zurückgerollt)'
        type: boolean
        default: false

# Zwei gleichzeitige Migrationsläufe auf derselben Datenbank wären ein Problem.
concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest

    env:
      # Einmal hier, damit die Schritte darunter nur noch $DB_URL brauchen.
      # GitHub maskiert Secrets in der Ausgabe; ausgegeben wird der Wert
      # trotzdem nirgends.
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REGION: ${{ vars.SUPABASE_REGION || 'eu-central-1' }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'hfrvdbaiyeddeiyprwmw' }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Voraussetzungen prüfen
        env:
          ACCOUNT_PW: ${{ secrets.ACCOUNT_PW }}
          SB_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SB_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # Zeigt an, was ankommt — ohne Werte preiszugeben. Die Länge hilft
          # bei versehentlich mitkopierten Leerzeichen oder Anführungszeichen.
          zeige() {
            if [ -n "$2" ]; then
              printf '  vorhanden  %-28s (%s Zeichen)\n' "$1" "${#2}"
            else
              printf '  FEHLT      %-28s\n' "$1"
            fi
          }

          echo "Secrets:"
          zeige "SUPABASE_DB_URL" "$DB_URL"
          zeige "SUPABASE_DB_PASSWORD" "$DB_PASSWORD"
          zeige "ACCOUNT_PW" "$ACCOUNT_PW"
          zeige "PUBLIC_SUPABASE_URL" "$SB_URL"
          zeige "PUBLIC_SUPABASE_ANON_KEY" "$SB_KEY"
          echo "Variablen (nur für den Rückfallweg):"
          printf '  %-28s %s\n' "SUPABASE_REGION" "$REGION"
          printf '  %-28s %s\n' "SUPABASE_PROJECT_REF" "$PROJECT_REF"
          echo ""

          if [ -z "$DB_URL" ] && [ -z "$DB_PASSWORD" ]; then
            echo "::error::Weder SUPABASE_DB_URL noch SUPABASE_DB_PASSWORD kommen an."
            echo ""
            echo "Gebraucht wird eines von beiden. Am wenigsten Arbeit macht"
            echo "SUPABASE_DB_PASSWORD — nur das Datenbankpasswort, den Rest"
            echo "sucht dieser Workflow selbst."
            echo ""
            echo "Kommt ein gesetztes Secret hier leer an, liegt es fast immer an:"
            echo "  1. Es steht unter 'Environment secrets' statt unter"
            echo "     'Repository secrets'. Beides auf derselben Seite —"
            echo "     gebraucht wird der obere Block."
            echo "  2. Es wurde unter 'Variables' statt 'Secrets' angelegt."
            echo "  3. Es liegt bei Codespaces oder Dependabot statt bei Actions."
            echo ""
            echo "Richtige Seite:"
            echo "  https://github.com/moreHering/Japan/settings/secrets/actions"
            exit 1
          fi

          if [ -z "$ACCOUNT_PW" ]; then
            echo "::warning::ACCOUNT_PW fehlt — die Konten werden nicht angelegt."
          fi

          psql --version

      - name: Verbindung aufbauen
        id: verbindung
        run: |
          set -uo pipefail

          # Das Passwort muss in die URL umkodiert werden: Zeichen wie @ : /
          # würden den String sonst zerlegen und die Verbindung scheitern
          # lassen, ohne dass der Grund erkennbar wäre.
          kodiere() {
            python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"
          }

          versuche() {
            # Gibt 0 zurück, wenn die Verbindung steht. Die Ausgabe von psql
            # wandert in eine Datei, damit das Passwort nicht im Protokoll
            # landen kann, falls psql es je zurückgäbe.
            psql "$1" -v ON_ERROR_STOP=1 -tAc "select 1" > /tmp/probe.txt 2>&1
          }

          if [ -n "$DB_URL" ]; then
            ZIEL="$DB_URL"
            echo "::add-mask::$ZIEL"
            echo "Verbindung über den hinterlegten Connection String."
            if ! versuche "$ZIEL"; then
              echo "::error::Der hinterlegte Connection String funktioniert nicht."
              sed 's/postgres[^ ]*@/***@/g' /tmp/probe.txt
              exit 1
            fi
          else
            # Ohne fertigen String: Adresse selbst zusammensetzen. Die Region
            # steht nicht fest — statt sie zu raten, wird sie gesucht. Ein
            # Pooler in der falschen Region antwortet sofort mit
            # "Tenant or user not found", das kostet also kaum Zeit.
            PW=$(kodiere "$DB_PASSWORD")
            REGIONEN="$REGION eu-central-1 eu-central-2 eu-west-1 eu-west-2 eu-west-3 eu-north-1 \
                      us-east-1 us-east-2 us-west-1 us-west-2 ca-central-1 sa-east-1 \
                      ap-northeast-1 ap-northeast-2 ap-south-1 ap-southeast-1 ap-southeast-2"

            echo "Suche den Pooler des Projekts ${PROJECT_REF} …"
            GEFUNDEN=""
            PROBIERT=""
            for r in $REGIONEN; do
              case " $PROBIERT " in *" $r "*) continue;; esac
              PROBIERT="$PROBIERT $r"

              KANDIDAT="postgresql://postgres.${PROJECT_REF}:${PW}@aws-0-${r}.pooler.supabase.com:5432/postgres?sslmode=require&connect_timeout=8"
              echo "::add-mask::$KANDIDAT"

              if versuche "$KANDIDAT"; then
                echo "  $r  ✓"
                GEFUNDEN="$r"
                ZIEL="$KANDIDAT"
                break
              fi

              GRUND=$(head -1 /tmp/probe.txt | sed 's/postgres[^ ]*@/***@/g')
              case "$GRUND" in
                *"Tenant or user not found"*) echo "  $r  — dort liegt das Projekt nicht";;
                *"password authentication failed"*|*"Wrong password"*)
                  echo "  $r  — Projekt gefunden, aber das Passwort stimmt nicht."
                  echo "::error::Region $r ist richtig, das Passwort nicht. Neu setzen und das Secret ersetzen."
                  exit 1;;
                *) echo "  $r  — $GRUND";;
              esac
            done

            if [ -z "$GEFUNDEN" ]; then
              echo "::error::In keiner der geprüften Regionen antwortet das Projekt ${PROJECT_REF}."
              echo ""
              echo "Mögliche Gründe:"
              echo "  · Die Projekt-Referenz stimmt nicht. Sie steht in der Adresse"
              echo "    des Dashboards: dashboard/project/<HIER>."
              echo "  · Das Projekt ist pausiert — dann im Dashboard aufwecken."
              echo "  · Supabase hat das Adressschema geändert. Dann hilft nur der"
              echo "    vollständige Connection String als SUPABASE_DB_URL."
              exit 1
            fi

            echo ""
            echo "Region gefunden: $GEFUNDEN"
            if [ "$GEFUNDEN" != "$REGION" ]; then
              echo "::notice::Region ist $GEFUNDEN. Als Repository-Variable SUPABASE_REGION eintragen, dann entfällt die Suche."
            fi
          fi

          set -e
          echo "ziel=$ZIEL" >> "$GITHUB_OUTPUT"

          psql "$ZIEL" -v ON_ERROR_STOP=1 -tAc \
            "select 'verbunden mit ' || current_database() || ', ' || split_part(version(), ' on ', 1);"

      - name: Migrationen einspielen
        env:
          ZIEL: ${{ steps.verbindung.outputs.ziel }}
          # Gemeinsames Anmeldepasswort der drei Konten.
          ACCOUNT_PW: ${{ secrets.ACCOUNT_PW }}
        run: |
          set -euo pipefail

          for datei in supabase/migrations/*.sql; do
            echo ""
            echo "── $datei ──────────────────────────────────────────"
            psql "$ZIEL" -v ON_ERROR_STOP=1 -v pw="${ACCOUNT_PW:-}" -f "$datei"
          done

      - name: Ergebnis prüfen
        env:
          ZIEL: ${{ steps.verbindung.outputs.ziel }}
        run: |
          set -euo pipefail

          echo "Tabellen und RLS-Status:"
          psql "$ZIEL" -v ON_ERROR_STOP=1 -c "
            select c.relname as tabelle,
                   c.relrowsecurity as rls,
                   (select count(*) from pg_policies p
                     where p.schemaname='public' and p.tablename=c.relname) as policies
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
             where n.nspname='public' and c.relkind='r'
             order by c.relname;"

          echo ""
          echo "Zugelassene Bearbeiter:"
          psql "$ZIEL" -v ON_ERROR_STOP=1 -c "select name, farbe from public.profiles order by name;"

          echo ""
          echo "Bilderablage:"
          psql "$ZIEL" -tAc "
            select coalesce(
              (select 'vorhanden, ' || coalesce(file_size_limit, 0) / 1048576 || ' MB je Datei'
                 from storage.buckets where id = 'freundebuch'),
              'FEHLT');" 2>/dev/null || echo "  storage-Schema nicht lesbar"

          # Eine Tabelle ohne RLS wäre mit dem öffentlich lesbaren Schlüssel
          # für jeden zugänglich — das darf nicht unbemerkt durchgehen.
          OFFEN=$(psql "$ZIEL" -tAc "
            select count(*) from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
             where n.nspname='public' and c.relkind='r' and not c.relrowsecurity;")

          if [ "$OFFEN" != "0" ]; then
            echo "::error::$OFFEN Tabelle(n) ohne Row Level Security."
            exit 1
          fi

          echo ""
          echo "Alle Tabellen haben Row Level Security."

      # Wenn die Anmeldung scheitert, liegt es fast nie an den Tabellen,
      # sondern an `auth.users`. GoTrue liest einige Spalten in Go-Strings ein
      # und stolpert über NULL — Konten, die per SQL entstanden sind, haben
      # genau dort oft nichts stehen. Diese Ausgabe zeigt es, statt raten zu
      # lassen.
      - name: Konten durchleuchten
        if: always()
        env:
          ZIEL: ${{ steps.verbindung.outputs.ziel }}
        run: |
          set -uo pipefail
          [ -n "${ZIEL:-}" ] || { echo "Keine Verbindung — übersprungen."; exit 0; }

          echo "Spalten in auth.users, die NULL sind:"
          psql "$ZIEL" -c "
            select u.email,
                   u.aud, u.role,
                   u.email_confirmed_at is not null as bestaetigt,
                   u.encrypted_password is not null as passwort_da,
                   u.banned_until is null           as nicht_gesperrt,
                   u.deleted_at is null             as nicht_geloescht
              from auth.users u
             where u.email like '%@japan2026.local'
             order by u.email;"

          echo "Textspalten, die GoTrue nicht NULL sein dürfen:"
          psql "$ZIEL" -c \
            "select a.attname as spalte, count(*) filter (where x.ist_null) as mit_null
                from pg_attribute a
                join pg_class c on c.oid = a.attrelid
                join pg_namespace n on n.oid = c.relnamespace
               cross join lateral (
                 select exists (
                   select 1 from auth.users u
                    where u.email like '%@japan2026.local'
                      and (to_jsonb(u) ->> a.attname) is null
                 ) as ist_null
               ) x
               where n.nspname = 'auth' and c.relname = 'users'
                 and a.attnum > 0 and not a.attisdropped
                 and format_type(a.atttypid, null) like '%char%'
               group by a.attname
              having count(*) filter (where x.ist_null) > 0
               order by a.attname;"

          echo "Identities:"
          psql "$ZIEL" -c "
            select i.provider, i.provider_id is not null as provider_id_da,
                   i.identity_data ->> 'email' as email
              from auth.identities i
              join auth.users u on u.id = i.user_id
             where u.email like '%@japan2026.local'
             order by 3;"

      # Nur auf Anforderung: geht den Löschweg der App nach, als Rolle
      # authenticated und mit Kennung im Claim, in einer Transaktion, die
      # zurückgerollt wird. Zeigt, ob der Trigger auf storage.objects abbricht
      # (dann scheitert das Löschen ganz) oder wegen RLS nichts trifft (dann
      # bleibt das Bild liegen). Beides sieht in der App völlig anders aus.
      - name: Löschen prüfen
        if: inputs.loeschen_pruefen
        env:
          ZIEL: ${{ steps.verbindung.outputs.ziel }}
        run: |
          set -uo pipefail
          [ -n "${ZIEL:-}" ] || { echo "Keine Verbindung — übersprungen."; exit 0; }
          psql "$ZIEL" -f supabase/test/loeschen-probe.sql
