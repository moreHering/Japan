name: Datenbank migrieren

# Spielt die Migrationen aus supabase/migrations/ gegen das Supabase-Projekt ein.
#
# Warum über die CI und nicht aus der Entwicklungsumgebung: Die erreicht die
# Datenbank auf keinem Weg. Gemessen, nicht vermutet:
#
#   supabase.co / supabase.com   CONNECT tunnel failed, 403 am Proxy
#   db.<ref>.supabase.co         löst überhaupt nicht mehr auf
#   Pooler :5432 und :6543       keine Antwort (nur :443 ist offen)
#   IPv6                         keine globale Adresse vorhanden
#
# GitHub-Runner haben freies Netz. Deshalb läuft es hier.
#
# ## Was gebraucht wird
#
# **Der einfache Weg:** ein einziges Secret `SUPABASE_DB_URL` — der vollständige
# Connection String aus dem Dashboard unter *Project Settings → Database →
# Connection string → URI* (Session-Pooler wählen, damit es über IPv4 geht).
# Darin stehen Host, Port, Benutzer, Passwort und Datenbank; nichts muss
# geraten werden.
#
# **Der alte Weg** bleibt als Rückfallebene: `SUPABASE_DB_PASSWORD` plus die
# Variablen SUPABASE_REGION und SUPABASE_PROJECT_REF. Der setzt voraus, dass
# Supabase seine Adressen weiter nach demselben Muster bildet — genau das ist
# eine Annahme, die man sich sparen kann.

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:

# Zwei gleichzeitige Migrationsläufe auf derselben Datenbank wären ein Problem.
concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest

    env:
      # Einmal hier, damit die Schritte darunter nur noch $DB_URL brauchen.
      # GitHub maskiert Secrets in der Ausgabe; ausgegeben wird der Wert
      # trotzdem nirgends.
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      REGION: ${{ vars.SUPABASE_REGION || 'eu-central-1' }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'hfrvdbaiyeddeiyprwmw' }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Voraussetzungen prüfen
        env:
          ACCOUNT_PW: ${{ secrets.ACCOUNT_PW }}
          SB_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SB_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          # Zeigt an, was ankommt — ohne Werte preiszugeben. Die Länge hilft
          # bei versehentlich mitkopierten Leerzeichen oder Anführungszeichen.
          zeige() {
            if [ -n "$2" ]; then
              printf '  vorhanden  %-28s (%s Zeichen)\n' "$1" "${#2}"
            else
              printf '  FEHLT      %-28s\n' "$1"
            fi
          }

          echo "Secrets:"
          zeige "SUPABASE_DB_URL" "$DB_URL"
          zeige "SUPABASE_DB_PASSWORD" "$DB_PASSWORD"
          zeige "ACCOUNT_PW" "$ACCOUNT_PW"
          zeige "PUBLIC_SUPABASE_URL" "$SB_URL"
          zeige "PUBLIC_SUPABASE_ANON_KEY" "$SB_KEY"
          echo "Variablen (nur für den Rückfallweg):"
          printf '  %-28s %s\n' "SUPABASE_REGION" "$REGION"
          printf '  %-28s %s\n' "SUPABASE_PROJECT_REF" "$PROJECT_REF"
          echo ""

          if [ -z "$DB_URL" ] && [ -z "$DB_PASSWORD" ]; then
            echo "::error::Weder SUPABASE_DB_URL noch SUPABASE_DB_PASSWORD kommen an."
            echo ""
            echo "Gebraucht wird eines von beiden — am einfachsten SUPABASE_DB_URL:"
            echo "  Supabase → Project Settings → Database → Connection string → URI"
            echo "  (Session pooler wählen), vollständig kopieren."
            echo ""
            echo "Kommt ein gesetztes Secret hier leer an, liegt es fast immer an:"
            echo "  1. Es steht unter 'Environment secrets' statt unter"
            echo "     'Repository secrets'. Beides auf derselben Seite —"
            echo "     gebraucht wird der obere Block."
            echo "  2. Es wurde unter 'Variables' statt 'Secrets' angelegt."
            echo "  3. Es liegt bei Codespaces oder Dependabot statt bei Actions."
            echo ""
            echo "Richtige Seite:"
            echo "  https://github.com/moreHering/Japan/settings/secrets/actions"
            exit 1
          fi

          if [ -z "$ACCOUNT_PW" ]; then
            echo "::warning::ACCOUNT_PW fehlt — die Konten werden nicht angelegt."
          fi

          psql --version

      - name: Verbindung aufbauen
        id: verbindung
        run: |
          set -euo pipefail

          if [ -n "$DB_URL" ]; then
            ZIEL="$DB_URL"
            echo "Verbindung über den hinterlegten Connection String."
          else
            # Rückfallweg: Adressen nach dem bekannten Muster zusammensetzen.
            # Der Session-Pooler ist der einzige Weg mit IPv4 — die direkte
            # Adresse db.<ref>.supabase.co löst nur auf IPv6 auf.
            ZIEL="postgresql://postgres.${PROJECT_REF}:${DB_PASSWORD}@aws-0-${REGION}.pooler.supabase.com:5432/postgres?sslmode=require"
            echo "Verbindung zusammengesetzt: aws-0-${REGION}.pooler.supabase.com als postgres.${PROJECT_REF}"
          fi

          # Der String enthält das Passwort und darf nirgends in der Ausgabe
          # landen. Als Ausgabe eines Schritts wird er von GitHub maskiert,
          # weil er aus einem Secret stammt bzw. eines enthält.
          echo "::add-mask::$ZIEL"
          echo "ziel=$ZIEL" >> "$GITHUB_OUTPUT"

          psql "$ZIEL" -v ON_ERROR_STOP=1 -tAc \
            "select 'verbunden mit ' || current_database() || ', ' || split_part(version(), ' on ', 1);"

      - name: Migrationen einspielen
        env:
          ZIEL: ${{ steps.verbindung.outputs.ziel }}
          # Gemeinsames Anmeldepasswort der drei Konten.
          ACCOUNT_PW: ${{ secrets.ACCOUNT_PW }}
        run: |
          set -euo pipefail

          for datei in supabase/migrations/*.sql; do
            echo ""
            echo "── $datei ──────────────────────────────────────────"
            psql "$ZIEL" -v ON_ERROR_STOP=1 -v pw="${ACCOUNT_PW:-}" -f "$datei"
          done

      - name: Ergebnis prüfen
        env:
          ZIEL: ${{ steps.verbindung.outputs.ziel }}
        run: |
          set -euo pipefail

          echo "Tabellen und RLS-Status:"
          psql "$ZIEL" -v ON_ERROR_STOP=1 -c "
            select c.relname as tabelle,
                   c.relrowsecurity as rls,
                   (select count(*) from pg_policies p
                     where p.schemaname='public' and p.tablename=c.relname) as policies
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
             where n.nspname='public' and c.relkind='r'
             order by c.relname;"

          echo ""
          echo "Zugelassene Bearbeiter:"
          psql "$ZIEL" -v ON_ERROR_STOP=1 -c "select name, farbe from public.profiles order by name;"

          echo ""
          echo "Bilderablage:"
          psql "$ZIEL" -tAc "
            select coalesce(
              (select 'vorhanden, ' || coalesce(file_size_limit, 0) / 1048576 || ' MB je Datei'
                 from storage.buckets where id = 'freundebuch'),
              'FEHLT');" 2>/dev/null || echo "  storage-Schema nicht lesbar"

          # Eine Tabelle ohne RLS wäre mit dem öffentlich lesbaren Schlüssel
          # für jeden zugänglich — das darf nicht unbemerkt durchgehen.
          OFFEN=$(psql "$ZIEL" -tAc "
            select count(*) from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
             where n.nspname='public' and c.relkind='r' and not c.relrowsecurity;")

          if [ "$OFFEN" != "0" ]; then
            echo "::error::$OFFEN Tabelle(n) ohne Row Level Security."
            exit 1
          fi

          echo ""
          echo "Alle Tabellen haben Row Level Security."
