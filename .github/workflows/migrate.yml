name: Datenbank migrieren

# Spielt die Migrationen aus supabase/migrations/ gegen das Supabase-Projekt ein.
#
# Warum über die CI und nicht lokal: Die Entwicklungsumgebung erreicht die
# Datenbank nicht (API gesperrt, Direktverbindung nur über IPv6, Pooler-Ports
# geschlossen). GitHub-Runner haben freies Netz.

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:

# Zwei gleichzeitige Migrationsläufe auf derselben Datenbank wären ein Problem.
concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Voraussetzungen prüfen
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          ACCOUNT_PW: ${{ secrets.ACCOUNT_PW }}
          SB_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SB_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          REGION: ${{ vars.SUPABASE_REGION }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          # Zeigt an, was ankommt — ohne Werte preiszugeben. Die Länge hilft
          # bei versehentlich mitkopierten Leerzeichen oder Anführungszeichen.
          zeige() {
            if [ -n "$2" ]; then
              printf '  vorhanden  %-28s (%s Zeichen)\n' "$1" "${#2}"
            else
              printf '  FEHLT      %-28s\n' "$1"
            fi
          }

          echo "Secrets:"
          zeige "SUPABASE_DB_PASSWORD" "$DB_PASSWORD"
          zeige "ACCOUNT_PW" "$ACCOUNT_PW"
          zeige "PUBLIC_SUPABASE_URL" "$SB_URL"
          zeige "PUBLIC_SUPABASE_ANON_KEY" "$SB_KEY"
          echo "Variablen (optional):"
          zeige "SUPABASE_REGION" "$REGION"
          zeige "SUPABASE_PROJECT_REF" "$PROJECT_REF"
          echo ""

          if [ -z "$DB_PASSWORD" ]; then
            echo "::error::Das Secret SUPABASE_DB_PASSWORD kommt leer an."
            echo ""
            echo "Häufigste Ursachen, in dieser Reihenfolge:"
            echo "  1. Es liegt unter 'Environment secrets' statt unter"
            echo "     'Repository secrets'. Beide stehen auf derselben Seite —"
            echo "     gebraucht wird der obere Block 'Repository secrets'."
            echo "  2. Der Name weicht ab (Bindestrich statt Unterstrich,"
            echo "     Kleinschreibung, Tippfehler)."
            echo "  3. Es wurde unter 'Variables' statt 'Secrets' angelegt."
            echo ""
            echo "Anzulegen unter:"
            echo "  https://github.com/moreHering/Japan/settings/secrets/actions"
            exit 1
          fi

          if [ -z "$ACCOUNT_PW" ]; then
            echo "::warning::ACCOUNT_PW fehlt — die Konten werden nicht angelegt."
          fi

          psql --version

      - name: Migrationen einspielen
        env:
          # Der Session-Pooler ist der einzige Weg mit IPv4 — die direkte
          # Adresse db.<ref>.supabase.co löst ausschließlich auf IPv6 auf.
          PGHOST: aws-0-${{ vars.SUPABASE_REGION || 'eu-central-1' }}.pooler.supabase.com
          PGPORT: '5432'
          PGUSER: postgres.${{ vars.SUPABASE_PROJECT_REF || 'hfrvdbaiyeddeiyprwmw' }}
          PGDATABASE: postgres
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
          # Gemeinsames Anmeldepasswort der drei Konten.
          ACCOUNT_PW: ${{ secrets.ACCOUNT_PW }}
        run: |
          set -euo pipefail

          echo "Verbindung zu $PGHOST als $PGUSER"
          psql -v ON_ERROR_STOP=1 -tAc "select current_database(), version();"

          for datei in supabase/migrations/*.sql; do
            echo ""
            echo "── $datei ──────────────────────────────────────────"
            psql -v ON_ERROR_STOP=1 -v pw="${ACCOUNT_PW:-}" -f "$datei"
          done

      - name: Ergebnis prüfen
        env:
          PGHOST: aws-0-${{ vars.SUPABASE_REGION || 'eu-central-1' }}.pooler.supabase.com
          PGPORT: '5432'
          PGUSER: postgres.${{ vars.SUPABASE_PROJECT_REF || 'hfrvdbaiyeddeiyprwmw' }}
          PGDATABASE: postgres
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
        run: |
          set -euo pipefail

          echo "Tabellen und RLS-Status:"
          psql -v ON_ERROR_STOP=1 -c "
            select c.relname as tabelle,
                   c.relrowsecurity as rls,
                   (select count(*) from pg_policies p
                     where p.schemaname='public' and p.tablename=c.relname) as policies
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
             where n.nspname='public' and c.relkind='r'
             order by c.relname;"

          echo ""
          echo "Zugelassene Bearbeiter:"
          psql -v ON_ERROR_STOP=1 -c "select name, farbe from public.profiles order by name;"

          # Eine Tabelle ohne RLS wäre mit dem öffentlich lesbaren Schlüssel
          # für jeden zugänglich — das darf nicht unbemerkt durchgehen.
          OFFEN=$(psql -tAc "
            select count(*) from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
             where n.nspname='public' and c.relkind='r' and not c.relrowsecurity;")

          if [ "$OFFEN" != "0" ]; then
            echo "::error::$OFFEN Tabelle(n) ohne Row Level Security."
            exit 1
          fi
          echo "Alle Tabellen sind durch RLS geschützt."
