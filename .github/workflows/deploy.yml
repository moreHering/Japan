name: Deploy to GitHub Pages

on:
  push:
    # Das Repository hatte beim Anlegen noch keinen main-Branch. Damit der erste
    # Deploy auch vom Entwicklungsbranch aus läuft, ist dieser mit aufgeführt.
    # Sobald main existiert, kann die zweite Zeile entfernt werden.
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deploy gleichzeitig; laufende Deploys nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Astro-Seite bauen und hochladen
        uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
