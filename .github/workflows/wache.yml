# Der Wächter über Karte und Orte.
#
# Bis hierher lief keine einzige Prüfung dieses Projekts automatisch. `deploy.yml`
# sah nach, ob die Supabase-Secrets gesetzt sind, und baute dann — mit dem
# Kommentar „Die Browsertests laufen beim Entwickeln, nicht hier."
#
# Das ist nicht theoretisch schiefgegangen. In einer einzigen Sitzung sind zwei
# Regressionen entstanden: Der erste Ort auf der Orte-Seite rutschte von 326 px auf
# 454 px und damit unter die Falzkante, und zwei Routenknöpfe im Tagesplan standen
# 6 px auseinander. **Beide haben nur angeschlagen, weil die Suiten von Hand
# gestartet wurden.** Ohne das wären sie deployt.
#
# Dazu die Grundregel des Projekts, die in `PRUEFLISTE.md` steht: Auf der Reise ist
# ein falsch markierter Ort schlimmer als ein fehlender.
#
# Eigene Datei und nicht in `deploy.yml` hineingeschrieben, aus zwei Gründen: Sie
# kann über `workflow_call` als Tor vor den Deploy gehängt werden, und sie läuft
# auch auf einem Pull Request, wo nichts veröffentlicht werden soll.

name: Wache

# **Kein `on: push`**, und das ist beim ersten Lauf gelernt.
#
# Der erste Entwurf hatte eines. `deploy.yml` läuft auf denselben Pushes und ruft
# diesen Workflow über `workflow_call` — er liefe also **zweimal** je Push, mit
# allem doppelt: Chromium, Build, 327 Browserprüfungen, fünf Minuten Runnerzeit.
#
# Schlimmer als die Verschwendung ist, dass die `concurrency`-Gruppe unten es
# verdeckt hat: Beim ersten Push wurde der eigenständige Lauf abgebrochen, weil der
# Lauf aus dem Deploy in dieselbe Gruppe fiel. Welcher von beiden überlebt, hängt
# damit an der Startreihenfolge — und käme der eigenständige als zweiter, bräche er
# das Tor des Deploys **mitten im Lauf** ab. `build` sähe ein abgebrochenes
# `needs: wache` und scheiterte, ohne dass an der Anwendung etwas falsch wäre.
# Genau die Sorte Fehlschlag, die man eine Stunde lang im Code sucht.
#
# Auf einem Pull Request läuft `deploy.yml` nicht, dort wird also weiter selbst
# ausgelöst.
on:
  pull_request:
  # Damit `deploy.yml` diesen Lauf als Tor davorschalten kann.
  workflow_call:
  # Damit man ihn ohne neuen Commit wiederholen kann.
  workflow_dispatch:

permissions:
  contents: read

# Nur für die Pull-Request-Läufe von Belang: Ein neuer Push auf denselben Zweig
# macht den vorigen Lauf hinfällig. Die Läufe aus `deploy.yml` tragen eine eigene
# Gruppe — `github.workflow` ist dort der rufende Workflow —, deshalb kann diese
# Gruppe das Tor nicht mehr abwürgen.
concurrency:
  group: wache-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wache:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Ausdrücklich **keine** Supabase-Variablen.
    #
    # Das ist keine Vergesslichkeit, sondern Bedingung: Drei Suiten prüfen den
    # Zustand *ohne* Verbindung. `browser-tagebuch.mjs` erwartet den Kasten „keine
    # Verbindung" und dort das LoginPanel; mit gesetzten Secrets stünde etwas
    # anderes da, und die Suiten würden rot, obwohl die Anwendung richtig arbeitet.
    # Die 319 Browserprüfungen sind bisher alle ohne Supabase grün gelaufen — es
    # gibt in der Entwicklungsumgebung gar keine `.env`.

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        # `PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD` hier **nicht** setzen: Der Browser wird
        # gebraucht, und er soll in der Fassung kommen, die zu playwright 1.63 passt.
        run: npm ci

      # ------------------------------------------------------------------------
      # Zuerst das Billige. Die Ortsdatenprüfung braucht kein Netz, keinen Browser
      # und läuft in Sekunden. Ist eine Koordinate kaputt, erfährt man das nach
      # einer halben Minute und nicht nach sechs.
      # ------------------------------------------------------------------------

      - name: Ortsdaten auf Plausibilität prüfen
        run: npm run wache:daten

      - name: Astro-Typen erzeugen
        # Ohne diesen Schritt scheitert die Typprüfung auf einem frischen Checkout
        # mit drei Mal TS2339 „Property 'env' does not exist on type 'ImportMeta'"
        # (`src/lib/paths.ts:10`, `src/lib/supabase.ts:20-21`).
        #
        # Der Grund: `import.meta.env` ist eine Zutat von Astro und Vite, und die
        # Typen dafür stehen in `.astro/types.d.ts` — einer **erzeugten** Datei, die
        # `.gitignore:3` ausschließt. Auf einem Entwicklungsrechner ist sie da, weil
        # dort schon einmal `astro dev` oder `astro build` gelaufen ist. Auf einem
        # Runner gibt es sie beim ersten `tsc` nicht.
        #
        # Das war im ersten Lauf der erste rote Schritt — und es ist ein Fehler in
        # der Erprobung gewesen, nicht bloß im Workflow: Der „frische Klon", in dem
        # die Schrittfolge vorher von Hand durchlief, war eine `tar`-Kopie des
        # Arbeitsverzeichnisses und hat `.astro/` mitgenommen. Ein frischer Stand
        # ist, was **git** hat, nicht was im Verzeichnis liegt.
        run: npx astro sync

      - name: Typen prüfen
        # `|| true` steht hier **nicht**. Wenn die Typen nicht stimmen, ist Schluss.
        run: npx tsc --noEmit

      - name: Vitest
        run: npm test

      - name: Astro-Seite bauen
        # Die einzige Stelle, die den ausgelieferten Stand anfasst. Die
        # Browsersuiten laufen gegen den Dev-Server (siehe unten) und sehen ihn
        # nicht — was nur beim Bauen auffällt, fällt hier auf.
        run: npm run build

      # ------------------------------------------------------------------------
      # Ab hier der Browser.
      # ------------------------------------------------------------------------

      - name: Chromium aus dem Zwischenspeicher
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Der Schlüssel hängt an der Playwright-Fassung: Eine neue Fassung
          # erwartet eine neue Chromium-Revision, ein Treffer auf den alten
          # Schlüssel würde die falsche liefern — und der Fehler sähe dann aus wie
          # ein Fehler der Anwendung.
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Chromium installieren
        # `--with-deps` holt die Systembibliotheken, die Chromium auf einem nackten
        # Runner fehlen. Auch bei einem Cache-Treffer aufrufen: Der Zwischenspeicher
        # enthält den Browser, nicht die apt-Pakete.
        run: npx playwright install --with-deps chromium

      - name: Dev-Server starten
        id: devserver
        # Es muss der **Dev**-Server sein, nicht `astro preview`: Sechs der zehn
        # Suiten rufen im Browser `await import('/src/lib/store.svelte.ts')` auf, um
        # den Plan direkt zu setzen. Diesen Pfad löst nur Vite im Dev-Modus auf; im
        # statischen Build gibt es ihn nicht.
        #
        # Gewartet wird auf **Bereitschaft**, nicht auf eine Uhr: Ein `sleep 10`
        # ist auf einem ausgelasteten Runner zu kurz und auf einem leeren
        # Zeitverschwendung.
        #
        # **Mit `&`, und das ist eine Korrektur.**
        #
        # Der erste Entwurf hatte eines, der zweite nicht. Grund für das Entfernen
        # war eine Messung: In der Entwicklungsumgebung startet Astro 7 den
        # Dev-Server als Hintergrunddienst (`astro dev status` nennt ihn
        # „background"), kehrt nach vier Sekunden mit Exit 0 zurück, und der Dienst
        # überlebt die Schrittgrenze. Ein `&` wäre dort überflüssig gewesen.
        #
        # Auf dem Runner **bleibt er im Vordergrund**, und ohne `&` hing der Schritt
        # bis zum Abbruch. Das ist inzwischen belegt und nicht mehr vermutet: Mit `&`
        # war der Server im nächsten Lauf nach **drei Sekunden** erreichbar. Meine
        # erste Erklärung — der Daemon-Start wartet auf eine Bereitschaftsmeldung und
        # die erste Übersetzung dauert auf einem kalten Runner lange — war damit
        # falsch; es lag nicht an der Dauer, sondern daran, dass gar nicht
        # daemonisiert wird. (`CI=true` allein löst das nicht aus; hier daemonisiert
        # er auch damit.)
        #
        # Die Form mit `&` ist unter **beiden** Verhaltensweisen richtig, und genau
        # deshalb steht sie hier: Daemonisiert er, beendet sich die Hülle sofort und
        # die Bereitschaftsprüfung findet den Dienst; bleibt er im Vordergrund, hält
        # der Hintergrundprozess ihn am Leben. Eine Messung aus einer Umgebung gegen
        # eine andere zu setzen war der Fehler — Robustheit gewinnt gegen die
        # schönere Erklärung.
        #
        # Keine PID-Datei: `$!` wäre bei Daemonisierung die PID der Hülle und damit
        # eine Zahl, die aussieht wie eine Auskunft und keine ist. Zum Anhalten gibt
        # es `astro dev stop`.
        #
        # Nebenbei: Läuft schon ein Dev-Server, startet `astro dev` **keinen
        # zweiten** — auch nicht auf einem anderen Port. Auf einem frischen Runner
        # kein Thema; beim Nachfahren auf dem eigenen Rechner schon.
        run: |
          npx astro dev --port 4322 > /tmp/dev.log 2>&1 &
          # 180 Sekunden, und das ist inzwischen reine Reserve: Gemessen steht der
          # Server auf dem Runner nach **drei Sekunden** (Lauf 35, Schritt
          # „Dev-Server starten": 14:29:53 bis 14:29:56). Die Zahl bleibt trotzdem
          # hoch — sie kostet nichts, solange der Server kommt, und ein kalter
          # Runner mit einem größeren Projekt darf länger brauchen. Was sie nicht
          # ist: eine Aussage darüber, wie lange es dauert.
          for i in $(seq 1 180); do
            curl -sf -o /dev/null http://localhost:4322/Japan/plan/ && break
            sleep 1
          done
          # Die zweite Abfrage ist der eigentliche Punkt. Ohne sie läuft die
          # Schleife bei einem kaputten Server bis zum Ende durch, und die Suiten
          # melden danach zwanzig sinnlose Fehler statt der einen wahren Ursache.
          if ! curl -sf -o /dev/null http://localhost:4322/Japan/plan/; then
            echo "::error::Der Dev-Server ist nach 180 Sekunden nicht erreichbar."
            echo "--- Startausgabe ---"; cat /tmp/dev.log || true
            echo "--- astro dev status ---"; npx astro dev status || true
            echo "--- astro dev logs ---"; npx astro dev logs || true
            exit 1
          fi
          echo "Dev-Server steht."

      # Jede Suite ein eigener Schritt, und jede läuft auch dann, wenn eine vorige
      # rot war.
      #
      # `npm run test:all` verkettet mit `&&` und bricht beim ersten Fehlschlag ab.
      # Für das Entwickeln ist das richtig; hier nicht: Man will alle Ergebnisse
      # eines Laufs auf einmal sehen, sonst braucht man pro Fehler einen Lauf, und
      # das sind fünf Minuten je Fehler.
      #
      # Die Bedingung ist deshalb **nicht** `always()`, obwohl das der erste Entwurf
      # war. `always()` hätte die zehn Suiten auch dann gestartet, wenn der
      # Dev-Server nicht hochgekommen oder `npm ci` gescheitert ist — dann melden
      # sie zwanzig Verbindungsfehler und verdecken die eine wahre Ursache. Genau
      # das, wogegen die Bereitschaftsprüfung oben gebaut ist.
      #
      # Also: weiterlaufen, solange der Lauf nicht abgebrochen wurde **und** der
      # Server wirklich steht. Was davor rot war, hält den Lauf trotzdem rot — das
      # entscheidet GitHub am Ende, nicht diese Bedingung.

      - name: Orte
        if: ${{ !cancelled() && steps.devserver.outcome == 'success' }}
        run: node test/browser-orte.mjs

      - name: Karte
        if: ${{ !cancelled() && steps.devserver.outcome == 'success' }}
        run: node test/browser-karte.mjs

      - name: Suche
        if: ${{ !cancelled() && steps.devserver.outcome == 'success' }}
        run: node test/browser-suche.mjs

      - name: Korrekturen
        if: ${{ !cancelled() && steps.devserver.outcome == 'success' }}
        run: node test/browser-korrekturen.mjs

      - name: Reiseband
        if: ${{ !cancelled() && steps.devserver.outcome == 'success' }}
        run: node test/browser-reiseband.mjs

      - name: Tagesplan
        if: ${{ !cancelled() && steps.devserver.outcome == 'success' }}
        run: node test/browser-plan.mjs

      - name: Freundebuch
        if: ${{ !cancelled() && steps.devserver.outcome == 'success' }}
        run: node test/browser-freundebuch.mjs

      - name: Gästeansicht
        if: ${{ !cancelled() && steps.devserver.outcome == 'success' }}
        run: node test/browser-tagebuch.mjs

      - name: Google-Anbindung
        if: ${{ !cancelled() && steps.devserver.outcome == 'success' }}
        run: node test/browser-maps.mjs

      - name: Bildwahl
        if: ${{ !cancelled() && steps.devserver.outcome == 'success' }}
        run: node test/browser-bild.mjs

      - name: Log des Dev-Servers bei einem Fehlschlag
        # Ein Wächter, der nur „rot" sagt, kostet einen zweiten Lauf zum Nachsehen.
        if: failure()
        run: |
          echo "--- /tmp/dev.log (Startausgabe) ---"
          cat /tmp/dev.log || echo "(kein Log)"
          echo "--- astro dev logs (der Dienst selbst) ---"
          npx astro dev logs || echo "(kein Dienstprotokoll)"
